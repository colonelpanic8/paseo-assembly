# Written against the pre-profiles Live Voice API and linear on an old
# watch-live-voice reconstruction tip, so its stack merge resurrects the
# deleted assistants/templates modules and none of its own edits to files the
# profiles rewrite (context, runtime, links, settings, i18n) land. The fixup
# deletes the resurrected modules, re-applies the shortcut-link and settings
# work adapted to profiles (`?profile=` instead of `?assistant=`), keeps the
# wear fixtures on the new snapshot shape, and dedupes the keyboard repeat
# helper the merge re-inserts outside every conflict hunk.
fixup = "patches/voice-actions-stack-coherence.patch"

