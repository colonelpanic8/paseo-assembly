# fork-assembler manifest: which refs are tracked, in what order.

[remotes]
upstream = "git@github.com:getpaseo/paseo"
mine = "git@github.com:colonelpanic8/paseo"

[base]
remote = "upstream"
ref = "main"

[publish]
remote = "mine"
branch = "assembled"
tag_prefix = "paseo-assembled"

[[entry]]
pr = 2517
summary = "Reveal composer control shortcuts while holding Mod"

[[entry]]
pr = 2520
summary = "Add managed desktop host enrollment"

[[entry]]
pr = 2521
summary = "Add shortcut for next workspace needing attention"
fixup = "patches/sidebar-project-view-shortcut-targets.patch"

[[entry]]
branch = "mine:assembly-fdroid-variant"

# Merges 2525 and 2529 and adds a hover-revealed snooze quick action on the
# status-sidebar workspace cards, which needs both and so fits in neither.
# If this ever leaves the stack, exclude 2525 and 2529 if still open -- the
# parents declaration that keeps discovery away goes with the entry.
[[entry]]
pr = 2564
summary = "Combine sidebar redesign (2529) + agent snoozing (2525) + sidebar snooze action"
parents = [{ pr = 2525 }, { pr = 2529 }]
