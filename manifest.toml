# Combined PR: merges both parent PR heads onto upstream main and adds a
# hover-revealed snooze quick action next to archive on the status-sidebar
# workspace cards, which needs both parents and so cannot live in either
# parent PR. Carried by PR number, not as mine:status-sidebar-snooze, so
# discovery counts it as already carried instead of appending a second entry
# for the same work.
#
# The parents declaration keeps 2525 and 2529 out of the entry list (discovery
# skips them as carried-via-this-entry) and lets build reconstruct this entry
# when either parent moves: re-merge them onto the base, replay this branch's
# own commits on top. If this merges upstream, prune it and exclude the
# parents if their PRs are still open -- their content will be in the base by
# then, but the declaration that kept discovery away leaves with the entry.
[[entry]]
pr = 2564
summary = "Combine sidebar redesign (2529) + agent snoozing (2525) + sidebar snooze action"
parents = [{ pr = 2525 }, { pr = 2529 }]
reconstruction_publish = "mine:status-sidebar-snooze"
fixup = "patches/managed-host-colors.patch"

