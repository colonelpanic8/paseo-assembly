# fork-assembler manifest: INTENT only -- which refs are tracked, in what order.
# manifest.lock.json records FACT: the OIDs the last build used and the
# assembled tree hash. The assembled branch is compiled output; never develop
# on it or merge it back.

[remotes]
upstream = "git@github.com:getpaseo/paseo"
mine = "git@github.com:colonelpanic8/paseo"

[base]
remote = "upstream"
ref = "main"

[publish]
remote = "mine"
branch = "assembled"
tag_prefix = "paseo-assembled"

