# fork-assembler manifest: which refs are tracked, in what order.

[remotes]
upstream = "git@github.com:getpaseo/paseo"
mine = "git@github.com:colonelpanic8/paseo"

[base]
remote = "upstream"
ref = "main"

[publish]
remote = "mine"
branch = "assembled"
tag_prefix = "paseo-assembled"

