[[entry]]
pr = 2521
summary = "Add shortcut for next workspace needing attention"

# EXCLUDED: 2525 ("Add agent snoozing to workspace tabs") is carried via the
# combined PR 2564 below (branch mine:status-sidebar-snooze), which merges
# 2525 + 2529 and adds a sidebar snooze quick action on top. Do not re-add
# 2525 while 2564 is carried: its head is an ancestor of the combined branch, so
# carrying both merges the same snooze commits twice and any later divergence
# of the PR (rebase, review fixups) lands as duplicate/conflicting hunks.
#
# CAUTION: unlike the 2526 exclusion below, 2525 is still OPEN upstream,
# so `fork-fold add --prs-from colonelpanic8` WILL append it again ("not
# already carried" only checks the manifest). After any --prs-from sweep,
# delete the re-added 2525 (and 2529) entries before building. If either PR
# merges upstream, drop the combined branch instead and re-admit the survivor.
#
# [[entry]]
# pr = 2525
# summary = "Add agent snoozing to workspace tabs"

[[entry]]
branch = "mine:assembly-fdroid-variant"

# NOT YET BUILT: this removal has not been through `fork-fold build`. The last
# assembled tree still carries 2526 and the duplicate it causes.
#
# 2526 ("Show recently archived workspaces in the status sidebar") was CLOSED and
# re-authored into 2529. Never re-add it: carrying both merges two
# <SidebarArchivedGroup> renders into sidebar-status-list.tsx, so the sidebar
# shows the "Recently archived" group twice. `prune` cannot catch this -- 2526's
# commits never landed in the base, so it is not "contained in base" and would
# sit here through every prune. Discovery cannot re-add it either (`add
# --prs-from` sees open PRs only), so the only re-add path is by hand.
#
# patches/status-sidebar-archived-host-label.patch went with it: that fixup only
# threaded showHostLabels through to 2526's `showHostLabels={showHostLabels}`
# call site. 2529's own render hardcodes the prop, so with 2526 gone the patch
# has no consumer. Left on disk, unreferenced.

