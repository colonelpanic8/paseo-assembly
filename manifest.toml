# declaring watch-live-voice (or 2657) as a parent would repin it and rebuild a
# large tail. It also duplicates mine:live-voice-quick-launch's two commits
# (6cbe0daaec, 373c876dae -- identical patches to what that entry carries at
# 7e6db98790) so that it compiles on its own.
