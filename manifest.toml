# Open targets deliberately not carried. Closed and merged PRs do not need an
# entry here -- discovery only sweeps open ones. 2525 and 2529 are absent on
# purpose: they are parents of 2564 above, and a parent declaration and an
# exclusion for the same target cannot coexist.

# 2566's content is in 2564 under different commits, so `prune` cannot see the
# redundancy -- only the EMPTY merge revealed it. If 2564 ever leaves the
# stack, this content leaves with it.
[[exclude]]
pr = 2566
reason = "contained verbatim in 2564: merges EMPTY (use-minute-tick and time.ts are byte-identical between the heads)"

# Closed, so not strictly load-bearing, but kept: reopening either would let
# discovery re-admit a change held out on purpose, and that intent is
# recoverable from nowhere else.
[[exclude]]
pr = 2656
reason = "held out at user's request"

[[exclude]]
pr = 2514
reason = "held out at user's request: exclude the multi-account profiles change from the assembly"

[[exclude]]
pr = 2844
reason = "superseded by 2845, an independent and fuller take on the same direct model/thinking shortcuts; 2844's F13-F24 browser-pane policy test is the only content not in 2845"
