# Merges 2655 (Wear OS companion) and 2657 (Live Voice) and adds what needs
# both: watch-side start/end/mute and transcript, the Android AudioManager
# fix that routes call audio to a Bluetooth headset, pocket starts (nonce-staged
# trampoline that begins a call with the phone locked), earbuds-over-watch audio
# route arbitration with watch-side route display/selection, and one-shot
# Dispatch (watch STT -> prompt to a configured chief-of-staff agent).
#
# Do not re-carry mine:agent/live-voice-completion-notifications alongside
# 2657: that branch's commits are in 2657 re-authored, so the stack merged the
# same work twice. It is a branch, not a PR, so discovery cannot re-admit it.
[[entry]]
branch = "mine:watch-live-voice"
summary = "Drive Live Voice from the watch; route call audio to a Bluetooth headset"
parents = [{ pr = 2655 }, { branch = "mine:realtime-voice-actions" }]
reconstruction_publish = "mine:watch-live-voice"
# The agent payload builders only trip oxlint's complexity rule once 2657,
# 2658 and 2659 stack, so this belongs to no single topic branch.
fixup = "patches/agent-payload-complexity.patch"

# A hash of the whole assembled package-lock.json, so it goes stale whenever a
# dependency-affecting entry moves -- silently, since it applies cleanly either
# way. Never check it with a plain `nix build`: that passes instantly on a stale
# hash, because an FOD's store path comes from the declared hash. Use
# scripts/check-npm-deps-hash.sh (`--write` regenerates it); `just publish`
# refuses to push without it.
[[entry]]
patch = "patches/assembled-npm-deps-hash.patch"

