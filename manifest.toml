# Merges 2655 (Wear OS companion) and 2657 (Live Voice) and adds what needs
# both: watch-side start/end/mute and transcript, plus the Android AudioManager
# fix that routes call audio to a Bluetooth headset.
#
# Do not re-carry mine:agent/live-voice-completion-notifications alongside
# 2657: that branch's commits are in 2657 re-authored, so the stack merged the
# same work twice. It is a branch, not a PR, so discovery cannot re-admit it.
[[entry]]
