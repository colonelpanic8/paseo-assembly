summary = "Drive Live Voice from the watch; route call audio to a Bluetooth headset"
parents = [{ pr = 2655 }, { pr = 2657 }]
reconstruction_publish = "mine:watch-live-voice"
# The agent payload builders only trip oxlint's complexity rule once 2657,
# 2658 and 2659 stack, so this belongs to no single topic branch.
fixup = "patches/agent-payload-complexity.patch"

# A hash of the whole assembled package-lock.json, so it goes stale whenever a
# dependency-affecting entry moves -- silently, since it applies cleanly either
# way. Never check it with a plain `nix build`: that passes instantly on a stale
# hash, because an FOD's store path comes from the declared hash. Use
# scripts/check-npm-deps-hash.sh (`--write` regenerates it); `just publish`
# refuses to push without it.
[[entry]]
patch = "patches/assembled-npm-deps-hash.patch"

