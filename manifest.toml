# Targets deliberately not carried. These are enforced, not advisory: `add`
# skips them during a `--prs-from` sweep and errors if one is named directly,
# and the manifest fails to load if an entry ever carries an excluded target.
# Recorded with `fork-assembler exclude --pr N --reason ...`; removing one is a
# hand edit here.

# 2525 and 2529 are NOT excluded here: they are declared as parents of the
# 2564 entry above, which is the stronger statement -- it keeps discovery away
# the same way an exclusion would, and additionally tells build to
# reconstruct 2564 when either of them moves. The manifest rejects carrying a
# parent declaration and an exclusion for the same target at once.

# 2526 and 2559 are CLOSED, so discovery cannot re-add them and only a hand
# edit could. They are recorded anyway: an exclusion is what answers "why
# isn't this carried?" without git archaeology, and neither is a prune
# candidate -- their commits never landed in the base, so `prune` would never
# have removed them either.

# patches/status-sidebar-archived-host-label.patch belonged to 2526: it only
# threaded showHostLabels through to that PR's call site, and 2564's render
# hardcodes the prop. Left on disk, unreferenced.
[[exclude]]
pr = 2526
reason = "closed and re-authored into 2529, now carried via 2564; carrying both renders the Recently archived sidebar group twice"

[[exclude]]
pr = 2559
reason = "obviated by upstream 2490, which fixed issue 2554 in the base; closed upstream"

# 2536 and 2566 are also OPEN, so they need the same protection 2525 and 2529
# do. Unlike those two, their heads are NOT ancestors of 2564 -- 2564 carries
# the same work as differently-numbered commits, so `prune` cannot see the
# redundancy and only the EMPTY merge result revealed it. Each was carried for
# a while as a no-op entry. If 2564 ever leaves the stack, revisit both: the
# content leaves with it.
[[exclude]]
pr = 2536
reason = "contained verbatim in 2564, the combined branch this stack already carries: 2564 includes the Use portable Bash shebangs commit itself, so this entry has merged EMPTY since 2564 was admitted"

[[exclude]]
pr = 2566
reason = "contained verbatim in 2564, the combined branch this stack already carries: the use-minute-tick and time.ts files are byte-identical between the two heads, so this entry has merged EMPTY since 2564 was admitted"

[[exclude]]
pr = 2656
reason = "held out at user's request"

[[exclude]]
pr = 2514
reason = "held out at user's request: exclude the multi-account profiles change from the assembly"

[[exclude]]
pr = 2787
reason = "superseded by PR 2792, now merged into upstream main"

[[exclude]]
pr = 2506
